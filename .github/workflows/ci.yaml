name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: golangci/golangci-lint-action@v8
        with: {version: v2.5.0}
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: make cover
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - run: make mutate
  release:
    runs-on: ubuntu-latest
    needs: [lint, test, mutate]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Check the tag is a v0 or v1 semver
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[01]\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
