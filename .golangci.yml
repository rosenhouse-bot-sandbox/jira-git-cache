version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - revive
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
  settings:
    wrapcheck:
      ignore-package-globs:
        - github.com/rosenhouse-bot-sandbox/jira-git-cache/*
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, wrapcheck]
formatters:
  enable:
    - gofmt
    - goimports
